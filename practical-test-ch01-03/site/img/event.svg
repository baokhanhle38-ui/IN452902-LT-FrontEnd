<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF4FB"/>
      <stop offset="50%" stop-color="#D9ECFA"/>
      <stop offset="100%" stop-color="#C5E2F7"/>
    </linearGradient>

    <!-- EduHub Primary Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0082D6"/>
      <stop offset="100%" stop-color="#005A99"/>
    </linearGradient>

    <!-- Accent Danger Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334B"/>
      <stop offset="100%" stop-color="#E40C24"/>
    </linearGradient>

    <!-- Subtle Tech Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#006CB4" stroke-width="1" stroke-opacity="0.08"/>
    </pattern>

    <!-- Soft Drop Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#003B66" flood-opacity="0.18"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="640" height="360" fill="url(#bgGrad)"/>
  <!-- Decorative Grid Overlay -->
  <rect width="640" height="360" fill="url(#grid)"/>

  <!-- Abstract Ambient Circles -->
  <circle cx="100" cy="70" r="130" fill="#006CB4" fill-opacity="0.05" />
  <circle cx="560" cy="290" r="160" fill="#006CB4" fill-opacity="0.06" />
  <circle cx="540" cy="60" r="50" fill="#E40C24" fill-opacity="0.05" />

  <!-- Background Tech Elements / Wave line -->
  <path d="M-20 280 C 140 220, 260 340, 420 260 C 520 210, 600 240, 660 210" fill="none" stroke="#006CB4" stroke-width="3" stroke-dasharray="6 6" stroke-opacity="0.25"/>

  <!-- Main Illustration Group -->
  <g transform="translate(195, 45)" filter="url(#cardShadow)">
    <!-- Calendar Body Base -->
    <rect x="0" y="24" width="250" height="220" rx="20" fill="#FFFFFF"/>

    <!-- Calendar Top Bar -->
    <path d="M 0 44 Q 0 24 20 24 L 230 24 Q 250 24 250 44 L 250 78 L 0 78 Z" fill="url(#primaryGrad)"/>

    <!-- Top Rings / Bindings -->
    <g fill="#4B6375">
      <rect x="52" y="10" width="14" height="28" rx="7" fill="#2E4453"/>
      <rect x="184" y="10" width="14" height="28" rx="7" fill="#2E4453"/>
    </g>

    <!-- Month / Brand Header -->
    <text x="125" y="58" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="3" text-anchor="middle">EDUHUB EVENT</text>

    <!-- Calendar Date Grid / Activities -->
    <!-- Weekday mini header row -->
    <g fill="#A0AEC0">
      <circle cx="45" cy="104" r="5" fill="#CBD5E1"/>
      <circle cx="85" cy="104" r="5" fill="#CBD5E1"/>
      <circle cx="125" cy="104" r="5" fill="#CBD5E1"/>
      <circle cx="165" cy="104" r="5" fill="#CBD5E1"/>
      <circle cx="205" cy="104" r="5" fill="#CBD5E1"/>
    </g>

    <!-- Active Event Highlight Days -->
    <!-- Day 1: Primary active -->
    <rect x="33" y="124" width="26" height="26" rx="7" fill="#006CB4" fill-opacity="0.12"/>
    <circle cx="46" cy="137" r="5" fill="#006CB4"/>

    <!-- Day 2 -->
    <circle cx="85" cy="137" r="5" fill="#94A3B8"/>

    <!-- Day 3: Urgent / Special Event (Accent Color) -->
    <rect x="111" y="123" width="28" height="28" rx="8" fill="url(#accentGrad)" filter="url(#softGlow)"/>
    <circle cx="125" cy="137" r="5" fill="#FFFFFF"/>

    <!-- Day 4 -->
    <circle cx="165" cy="137" r="5" fill="#94A3B8"/>

    <!-- Day 5 -->
    <rect x="192" y="124" width="26" height="26" rx="7" fill="#006CB4" fill-opacity="0.12"/>
    <circle cx="205" cy="137" r="5" fill="#006CB4"/>

    <!-- Row 2 -->
    <circle cx="46" cy="172" r="5" fill="#94A3B8"/>
    <rect x="72" y="159" width="26" height="26" rx="7" fill="#006CB4" fill-opacity="0.12"/>
    <circle cx="85" cy="172" r="5" fill="#006CB4"/>
    <circle cx="125" cy="172" r="5" fill="#94A3B8"/>
    <circle cx="165" cy="172" r="5" fill="#CBD5E1"/>
    <circle cx="205" cy="172" r="5" fill="#CBD5E1"/>

    <!-- Bottom Event Status Banner inside Calendar -->
    <rect x="25" y="200" width="200" height="28" rx="8" fill="#F1F5F9"/>
    <circle cx="45" cy="214" r="4" fill="#006CB4"/>
    <rect x="58" y="211" width="80" height="6" rx="3" fill="#94A3B8"/>
    <rect x="150" y="210" width="55" height="8" rx="4" fill="url(#primaryGrad)"/>
  </g>

  <!-- Floating Badge: Workshop & Tech Icons -->
  <!-- Left floating badge: Code / Workshop symbol -->
  <g transform="translate(100, 150)" filter="url(#cardShadow)">
    <circle cx="36" cy="36" r="34" fill="#FFFFFF"/>
    <circle cx="36" cy="36" r="28" fill="#006CB4"/>
    <!-- Code brackets icon </> -->
    <path d="M 28 31 L 23 36 L 28 41 M 44 31 L 49 36 L 44 41 M 38 29 L 34 43" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right floating badge: Star / Speaker symbol -->
  <g transform="translate(470, 160)" filter="url(#cardShadow)">
    <circle cx="34" cy="34" r="32" fill="#FFFFFF"/>
    <circle cx="34" cy="34" r="26" fill="url(#accentGrad)"/>
    <!-- Star icon -->
    <path d="M 34 23 L 37.5 29.8 L 45 31 L 39.5 36.2 L 40.8 43.6 L 34 40.2 L 27.2 43.6 L 28.5 36.2 L 23 31 L 30.5 29.8 Z" fill="#FFFFFF"/>
  </g>

  <!-- Bottom Brand Mark Accent -->
  <g transform="translate(320, 325)">
    <rect x="-70" y="-14" width="140" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.85" stroke="#006CB4" stroke-width="1.5" stroke-opacity="0.3"/>
    <text x="0" y="3.5" fill="#006CB4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">EDUHUB • 2026</text>
  </g>
</svg>